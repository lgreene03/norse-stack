# Norse Stack — distributed quantitative trading infrastructure.
#
# Live mode: real Binance market data → features → strategy → sim execution.
# No API keys required — uses unauthenticated public market data streams.
#
# Usage:
#   docker compose up -d --build
#   ./scripts/smoke.sh
#   docker compose down -v
#
# Requires sibling checkouts: ../muninn, ../huginn, ../sleipnir
# Run ./scripts/clone-all.sh to set up all repos.
#
# Every published port is bound to 127.0.0.1. The short form "HOST:CONTAINER"
# binds to every interface, which exposed the databases, Grafana, the control
# planes and the research gateway to the whole local network until 2026-11-04.
# CI fails any port published without host IP 127.0.0.1 (see ci.yml, validate).

services:

  # ── Shared infrastructure ─────────────────────────────────────────────

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.1.0
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    restart: unless-stopped

  postgres-muninn:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muninn
      POSTGRES_USER: muninn
      POSTGRES_PASSWORD: ${MUNINN_DB_PASSWORD:-muninn}
    # No host port: only muninn uses this database, over the compose network.
    # For a shell: docker compose exec postgres-muninn psql -U muninn muninn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muninn"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata-muninn:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-huginn:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HUGINN_DB_PASSWORD:-postgres}
      POSTGRES_DB: huginn
    # No host port: only huginn uses this database, over the compose network.
    # For a shell: docker compose exec postgres-huginn psql -U postgres huginn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata-huginn:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # The recordings (muninn-raw) live in a host folder, not in Docker's storage.
    # Until 2026-11-10 /data was an anonymous volume declared by the image, which
    # `docker compose down -v` deleted (as do `make down` and
    # `scripts/smoke.sh --teardown`, which run it), and a plain `down` then `up`
    # orphaned. MINIO_DATA_DIR moves it, for example to an external drive;
    # the default keeps other machines working with no .env. Set
    # MINIO_DATA_DIR_CREATE=false with it, so that a missing folder stops MinIO
    # from starting instead of starting it on a new, empty one. Drive absent and
    # moving existing data: docs/RUNBOOK.md, section 6.
    volumes:
      - type: bind
        source: ${MINIO_DATA_DIR:-./data/minio}
        target: /data
        bind:
          create_host_path: ${MINIO_DATA_DIR_CREATE:-true}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/muninn-raw;
      mc mb --ignore-existing local/muninn-warehouse;
      mc mb --ignore-existing local/muninn-checkpoints;
      "

  # ── Topic provisioning ────────────────────────────────────────────────
  # Creates Kafka topics with explicit partitions + retention/cleanup policy
  # instead of relying on broker auto-create defaults (unbounded). Mirrors the
  # minio-init bucket step. Idempotent — safe to re-run. Per-topic rationale
  # lives in docs/CONTRACTS.md.
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/provision-topics.sh"]
    environment:
      BROKERS: redpanda:29092
      RPK: rpk
    volumes:
      - ./scripts/provision-topics.sh:/provision-topics.sh:ro
    restart: "no"

  # ── Application services ──────────────────────────────────────────────

  muninn:
    build:
      context: ../muninn
      dockerfile: Dockerfile
    depends_on:
      postgres-muninn:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      # Host side only, for reaching muninn's API from the host. Services in the
      # stack use muninn:8080 on the compose network, so changing this breaks
      # nothing inside. Set MUNINN_HOST_PORT when 8080 is taken on the host.
      - "127.0.0.1:${MUNINN_HOST_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-muninn:5432/muninn
      SPRING_DATASOURCE_USERNAME: muninn
      SPRING_DATASOURCE_PASSWORD: ${MUNINN_DB_PASSWORD:-muninn}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MUNINN_STORAGE_S3_ENDPOINT: http://minio:9000
      MUNINN_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MUNINN_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MUNINN_INGESTION_BINANCE_ENABLED: "true"
      MUNINN_INGESTION_OKX_ENABLED: "true"
      MUNINN_INGESTION_COINBASE_ENABLED: "false"
      # Ingest and RECORD only. Every raw trade and book from both venues goes to
      # the muninn-raw bucket (the history backtests need), and nothing else.
      #
      # The feature side is off because nothing here consumes it yet, not because
      # it is unsafe. Until 2026-11-10 muninn's OBI feature was named
      # features.obi.v1, the topic obi-bridge writes and huginn TRADES on, and one
      # muninn record reached it. Decision D1 gave that topic to obi-bridge and
      # lgreene03/muninn#87 moved every muninn feature, its comparator, stream and
      # archival under muninn.features.*, with a publish guard that refuses any
      # other topic. The engine, comparator and stream may now be enabled without
      # touching huginn's input; first see the follow-ups in
      # docs/ITERATION_GOALS.md (archival mislabels non-BTC symbols, and Redpanda
      # has no ACLs). Features are derived data and can be recomputed from what
      # the recorder keeps.
      MUNINN_FEATURES_ENGINE_ENABLED: "false"
      MUNINN_REPLAY_SHADOWCOMPARATOR_ENABLED: "false"
      MUNINN_STREAMING_ENABLED: "false"
      MUNINN_RECORDER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      # Tempo's OTLP gRPC port is plaintext; without this the exporter attempts
      # TLS and spams "first record does not look like a TLS handshake".
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    healthcheck:
      # Temurin JRE base ships bash but no curl/wget; probe the actuator port
      # over bash's /dev/tcp so the check needs no extra packages.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  huginn:
    build:
      context: ../huginn
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      postgres-huginn:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8081"
      - "127.0.0.1:50051:50051"
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_TOPICS: features.obi.v1
      KAFKA_GROUP_ID: huginn-paper-trader
      # Composite (pluggable-alpha) is the platform's flagship strategy: it blends
      # the default weighted alpha set (OBI + multi-timeframe momentum + EMA
      # mean-reversion) into one signed score, reusing the same cost-hurdle +
      # signed-position + risk path as OBI. Running it live is what makes the
      # console's Alpha Factory panel real — per-alpha contribution/confidence/IC
      # and the composite score flow from THIS strategy, not a mock. Set
      # STRATEGY_NAME back to "obi" for the single-signal microstructure baseline.
      STRATEGY_NAME: composite
      # For the composite this is the |combined score| entry band, NOT the OBI
      # imbalance threshold. The blended weighted-sum score lives on a smaller
      # scale than a single alpha (observed ~±0.12 on this feed), so 0.05 is the
      # calibrated band that lets real conviction reach the cost hurdle; the gate
      # (COST_HURDLE_K) then decides whether expected edge clears round-trip cost.
      STRATEGY_THRESHOLD: "0.05"
      STRATEGY_ORDER_SIZE: "0.001"
      # Cost-aware trading: only take an entry whose expected edge exceeds
      # COST_HURDLE_K x round-trip cost. On the 24h fixture k=1 flipped realized
      # PnL from -59 (235 fills) to +1 (32 fills) by cutting fee-bleeding
      # marginal trades. 0 disables the gate.
      COST_HURDLE_K: "1.0"
      OBI_EDGE_BPS_PER_UNIT: "60"
      # There is no ML model any more: huginn-ai was retired by G2.6 on 2026-11-22
      # (docs/CONTAINERS.md) without ever training on this data, and obi-bridge
      # now always sends its fallback mlScore of 0.5. The OBI ML gate is OFF
      # (STRATEGY_OBI_ML_GATE=false) and the shipped strategy is `composite`, whose
      # alphas never read mlScore, so the floor below is inert unless someone both
      # switches to STRATEGY_NAME=obi AND enables the gate.
      STRATEGY_OBI_ML_GATE: "false"
      STRATEGY_ML_MIN_CONFIDENCE: "0.05"
      LIVE_EXECUTION: "true"
      KAFKA_INTENTS_TOPIC: executions.intents.v1
      KAFKA_FILLS_TOPIC: executions.fills.v1
      DATABASE_ENABLED: "true"
      DATABASE_URL: postgres://postgres:${HUGINN_DB_PASSWORD:-postgres}@postgres-huginn:5432/huginn?sslmode=disable
      CAPITAL_INITIAL_CASH: "1000"
      KAFKA_PRICE_TOPIC: "prices.realtime.v1"
      SERVER_PORT: "8081"
      GRPC_PORT: "50051"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      # Tempo's OTLP gRPC port is plaintext; without this the exporter attempts
      # TLS and spams "first record does not look like a TLS handshake".
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # Control-plane bearer token gating mutating endpoints. Empty disables
      # auth; the local-dev default keeps the fail-closed middleware active.
      HUGINN_API_TOKEN: ${HUGINN_API_TOKEN:-localdev-change-me}
      # Walk-forward validation artifact served by GET /api/validation (and shown
      # in the console's Validation panel). Produced by `go run ./cmd/walkforward`
      # and mounted read-only below; the endpoint returns {available:false} if the
      # file is absent/empty, so this never fabricates a result.
      WALKFORWARD_RESULTS_PATH: /validation/walkforward_results.json
    volumes:
      - ../huginn/data/walkforward_results.json:/validation/walkforward_results.json:ro
    healthcheck:
      # Container health = liveness (process up). Use /healthz, NOT /readyz:
      # /readyz reflects consumer-loop progress (for alerting/k8s), and gating
      # the container on it would flap if the feature stream briefly pauses.
      # /healthz is on SERVER_PORT (8081); Alpine base ships busybox wget.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  sleipnir:
    build:
      context: ../sleipnir
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_INTENTS_TOPIC: executions.intents.v1
      KAFKA_FILLS_TOPIC: executions.fills.v1
      KAFKA_CONSUMER_GROUP: sleipnir-gateway
      EXCHANGE_BACKEND: sim
      SIM_TX_COST_BPS: "10"
      RATE_LIMIT_RPS: "10.0"
      PORT: "8080"
      DB_PATH: /app/data/sleipnir.db
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      # Tempo's OTLP gRPC port is plaintext; without this the exporter attempts
      # TLS and spams "first record does not look like a TLS handshake".
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # Control-plane admin token gating mutating endpoints. Empty disables
      # auth; the local-dev default keeps the fail-closed middleware active.
      SLEIPNIR_ADMIN_TOKEN: ${SLEIPNIR_ADMIN_TOKEN:-localdev-change-me}
    healthcheck:
      # Container health = liveness (process up). Use /healthz, NOT /readyz:
      # sleipnir's /readyz returns 200 only after the first intent is consumed,
      # so an idle-but-healthy gateway would be marked unhealthy until it trades.
      # /healthz is on PORT (8080); Alpine base ships busybox wget.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - sleipnir-data:/app/data
    restart: unless-stopped

  # ── Live data bridge ──────────────────────────────────────────────────

  obi-bridge:
    build:
      context: ./services/obi-bridge
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      OBI_TOPIC: features.obi.v1
      SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT"
      POLL_INTERVAL: "60"
      BOOK_LEVELS: "20"
      OBI_THRESHOLD: "0.95"
    healthcheck:
      # obi-bridge has no HTTP server; confirm the long-running bridge.py
      # process is still alive by scanning /proc cmdlines (python:slim has no
      # pgrep/curl). Liveness only — fails closed if the worker has exited.
      test: ["CMD-SHELL", "python3 -c \"import glob,sys; sys.exit(0 if any('bridge.py' in open(p,'rb').read().decode('utf-8','replace') for p in glob.glob('/proc/[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    # Conservative hardening (no read_only / cap_drop — keeps runtime + any
    # local writes working): block privilege escalation, bound CPU + PIDs.
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ── Analytics ────────────────────────────────────────────────────────

  odin:
    build:
      context: ./services/odin
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      KAFKA_BROKERS: redpanda:29092
      FILLS_TOPIC: executions.fills.v1
      PORT: "8086"
      INITIAL_CASH: "1000"
      # CORS: defaults to "*" (permissive). Lock to a single origin in prod.
      ACCESS_CONTROL_ALLOW_ORIGIN: ${ACCESS_CONTROL_ALLOW_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # bragi was retired on 2026-11-22 by the owner's decision (G2.6,
  # docs/CONTAINERS.md): it explained the retired order-book-imbalance signal's
  # decisions, and no console panel, scrape job or alert read it.

  # ── Research & Platform Services ──────────────────────────────────────

  # Research gateway (huginn's cmd/research). It runs nothing: under G1.2 run
  # submission is refused, because H1 and H2 trials run only through
  # research/norse_research's harness, which writes the trial ledger. It serves
  # runs earlier versions persisted, read-only. Every route but /healthz needs
  # the bearer token in secrets/research_token, mounted as a read-only secret
  # file and named by path (G0.4); without a valid one the API answers 503. It
  # sends no CORS headers and refuses a Host header other than 127.0.0.1,
  # localhost or research on 8094. docs/RUNBOOK.md, section 1.1.
  research:
    build:
      context: ../huginn
      dockerfile: Dockerfile.research
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      RESEARCH_PORT: "8094"
      RESEARCH_RESULTS_DIR: data/research
      HUGINN_RESEARCH_TOKEN_FILE: /run/secrets/research_token
    secrets:
      - research_token
    volumes:
      # Runs persisted by earlier versions of the gateway, served read-only.
      - ../huginn/data:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8094/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # mimir was retired on 2026-11-22 by the owner's decision (G2.6,
  # docs/CONTAINERS.md): it stored the retired signal's features, and H1 and H2
  # read manifest-pinned archives instead. Its `mimir-data` entry is gone from
  # `volumes:` below, but removing it from this file does NOT delete the Docker
  # volume, norse-stack_mimir-data. The owner decided to keep that data: 404,379
  # rows of features.obi.v1 since 2026-06-22, which cannot be recomputed. Once
  # the container is removed nothing uses the volume, so `docker volume prune -a`
  # would delete it; do not run that without the owner's say.

  # Forseti — execution transaction-cost analysis. Consumes executions.fills.v1
  # (+ prices.realtime.v1 for an arrival benchmark) → slippage, maker/taker,
  # implementation shortfall, cost attribution. Never fabricates a benchmark.
  forseti:
    build:
      context: ./services/forseti
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      KAFKA_BROKERS: redpanda:29092
      FILLS_TOPIC: executions.fills.v1
      PRICES_TOPIC: prices.realtime.v1
      PRICES_ENABLED: "true"
      FORSETI_PORT: "8096"
      ACCESS_CONTROL_ALLOW_ORIGIN: ${ACCESS_CONTROL_ALLOW_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # heimdall was retired on 2026-11-22 by the owner's decision (G2.6,
  # docs/CONTAINERS.md): no registered hypothesis uses its regime labels, and its
  # depends_on on mimir went with it.

  # huginn-ai was retired on 2026-11-22 by the owner's decision (G2.6,
  # docs/CONTAINERS.md): its model never trained on this data. obi-bridge's code
  # is frozen (D1) and still asks http://huginn-ai:8091 for mlScore on every
  # poll. fetch_ml_score catches any exception, the name no longer resolving
  # included, and falls back to mlScore 0.5 and mlReady 0, which is what it
  # already published; the request carries a 10 s timeout. news-sentinel's
  # missing name has taken the same path since 2026-11-21 without slowing the
  # poll, so obi-bridge neither crashes nor blocks.

  # ── Observability ─────────────────────────────────────────────────────

  # Daily recording gap audit (G0.15). Reads what muninn's recorder stored in
  # muninn-raw and measures, per venue and UTC day, the minutes covered, the gaps
  # longer than 60 s and the bytes recorded, from the event timestamps inside the
  # objects. Writes one JSON report per day and daily.csv to RECORDING_AUDIT_DIR,
  # and serves the same numbers as Prometheus metrics. Read-only on the store.
  # No depends_on, on purpose: with MinIO down the audit must still run and say
  # so (recording_audit_runs_total{result="failure"}), not fail to start.
  # docs/RUNBOOK.md, section 6.3.
  recording-audit:
    build:
      context: ./services/recording-audit
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8098:8098"
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: muninn-raw
      # The credentials MinIO and muninn take from .env, through the environment and
      # never on a command line (G0.4). To use a separate read-only user scoped to
      # muninn-raw, mount files and set S3_ACCESS_KEY_FILE and S3_SECRET_KEY_FILE,
      # which take precedence.
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AUDIT_PORT: "8098"
      AUDIT_REPORT_DIR: /reports
      AUDIT_INTERVAL_SECONDS: "900"
      # Recording began on 2026-10-27. Keep a complete report for every day since,
      # and refill any that go missing (newest first, after today's).
      AUDIT_EARLIEST_DAY: "2026-10-27"
      AUDIT_BACKFILL_DAYS: "366"
    volumes:
      - ${RECORDING_AUDIT_DIR:-./data/recording-audit}:/reports
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8098/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Distributed tracing collector. Huginn → Sleipnir spans propagate via W3C
  # TraceContext on Kafka headers and land here over OTLP/gRPC (port 4317).
  # Services only export when OTEL_EXPORTER_OTLP_ENDPOINT is set (see below);
  # with this collector present, the endpoint is wired by default.
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"  # Tempo HTTP / query API
      - "127.0.0.1:4317:4317"  # OTLP gRPC ingest
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9091:9090"
    # remote-write-receiver lets Tempo's metrics_generator push service-graph /
    # span metrics here so Grafana's service-graph view has data. The default
    # config-file + scrape flags must be restated when overriding command.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
    depends_on:
      huginn:
        condition: service_healthy
      alertmanager:
        condition: service_started
    mem_limit: 256m
    restart: unless-stopped

  # Routes Prometheus alerts. Minimal local-dev config with a null receiver
  # (see monitoring/alertmanager.yml); point a receiver at a real webhook to
  # actually deliver notifications.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 128m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-norse}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped

  # news-sentinel was retired by G2.6 (docs/CONTAINERS.md): its two RSS
  # sources' terms bar automated access and AI use (DATA_LICENCES.md, finding 1).
  # obi-bridge's newsSentiment field falls back to 0.0 without it.

volumes:
  sleipnir-data:
  pgdata-muninn:
  pgdata-huginn:
  # mimir-data is no longer declared: see the note where mimir's block was. The
  # Docker volume norse-stack_mimir-data still exists and is kept.

# Secret files, untracked under secrets/ (ignored by .gitignore). Each must
# exist before `docker compose up`; `make up` creates the research token when it
# is absent. docs/RUNBOOK.md, section 1.1.
secrets:
  research_token:
    file: ./secrets/research_token
